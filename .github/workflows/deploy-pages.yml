name: Reusable Deploy to GitHub Pages

# 可复用部署工作流（reusable workflow）。
#
# 本文件不自带任何事件触发器，只能通过 workflow_call 被其他工作流调用。
# 这样做的目的是让「人工 push」和「快讯自动更新」两条链路共用同一份
# 构建与发布逻辑，避免两处副本随时间漂移。
#
# 调用方：
#   - deploy.yml       （main 分支人工 push / 手动触发）
#   - update-news.yml  （每日快讯更新成功提交后）
#
# 注意：本文件不得添加 push 触发器，否则会与调用方形成重复部署。

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# 所有部署共用同一并发组，保证同一时间只有一次发布，
# 且不取消进行中的部署（避免发布到一半被打断）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Add .nojekyll
        run: touch ./out/.nojekyll

      - name: Add CNAME
        run: echo "aigc778.top" > ./out/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
