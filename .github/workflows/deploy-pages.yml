name: Reusable Deploy to GitHub Pages

# 可复用部署工作流（reusable workflow）。
#
# 本文件不自带任何事件触发器，只能通过 workflow_call 被其他工作流调用。
# 这样做的目的是让「人工 push」和「快讯自动更新」两条链路共用同一份
# 构建与发布逻辑，避免两处副本随时间漂移。
#
# 调用方：
#   - deploy.yml       （main 分支人工 push / 手动触发）
#   - update-news.yml  （每日快讯更新成功提交后）
#
# 注意：本文件不得添加 push 触发器，否则会与调用方形成重复部署。
#
# 关于 ref 输入：
#   workflow_call 被调用时，默认的 checkout 取到的是「调用方工作流启动时」
#   的那个 commit，而不是运行期间新产生的 commit。对于快讯自动更新链路，
#   bot 是在 job 运行过程中才创建新 commit 的，若不显式指定 ref，就会
#   构建并发布旧版本代码——表面成功，内容却是旧的。
#   因此这里要求调用方必须传入完整 commit SHA，并在 checkout 后校验。

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# 所有部署共用同一并发组，保证同一时间只有一次发布，
# 且不取消进行中的部署（避免发布到一半被打断）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # 双重确认：请求部署的 SHA 与实际检出的 SHA 必须完全一致。
      # 不一致说明部署目标发生了偏移，此时宁可失败也不要发布错误版本。
      - name: Verify checkout SHA
        shell: bash
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Requested deploy SHA: ${{ inputs.ref }}"
          echo "Actual checkout SHA:  $ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "${{ inputs.ref }}" ]; then
            echo "Checkout SHA does not match requested deploy SHA."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Add .nojekyll
        run: touch ./out/.nojekyll

      - name: Add CNAME
        run: echo "aigc778.top" > ./out/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
